<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc">
  <title id="title">按值分组与按连续段分组的对比</title>
  <desc id="desc">序列 A A B A A 直接按内容分组会得到 A 四行、B 一行，把被 B 隔开的两个 A 段合并；按连续段分组则得到三个岛：A 两行、B 一行、A 两行。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1000" height="660" rx="18" fill="#f8fafc"/>
  <rect x="0.5" y="0.5" width="999" height="659" rx="18" fill="none" stroke="#e2e8f0"/>

  <text x="48" y="56" font-family="'Segoe UI', 'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="26" font-weight="700" fill="#0f172a">按值分组 vs 按连续段分组</text>
  <text x="48" y="84" font-family="'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="15" fill="#64748b">按值分组会忽略顺序；同一个值可以在序列中出现多次，但属于不同的连续段。</text>

  <!-- top panel: GROUP BY -->
  <rect x="40" y="110" width="920" height="250" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="64" y="126" width="180" height="28" rx="14" fill="#fee2e2"/>
  <text x="154" y="145" text-anchor="middle" font-family="'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="12.5" font-weight="700" fill="#b91c1c">直接 GROUP BY content</text>
  <text x="64" y="174" font-family="'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="12.5" fill="#64748b">只按 content 聚合：A 出现 4 次，就被当成一个 4 行的组。</text>

  <!-- row numbers -->
  <g font-family="Consolas, monospace" font-size="12" fill="#94a3b8" text-anchor="middle">
    <text x="118" y="192">1</text>
    <text x="218" y="192">2</text>
    <text x="318" y="192">3</text>
    <text x="418" y="192">4</text>
    <text x="518" y="192">5</text>
  </g>

  <!-- cards -->
  <g font-family="Consolas, monospace" font-size="26" font-weight="700" text-anchor="middle">
    <rect x="80" y="200" width="76" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="118" y="237" fill="#1d4ed8">A</text>
    <rect x="180" y="200" width="76" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="218" y="237" fill="#1d4ed8">A</text>

    <rect x="280" y="200" width="76" height="58" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
    <text x="318" y="237" fill="#047857">B</text>

    <rect x="380" y="200" width="76" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="418" y="237" fill="#1d4ed8">A</text>
    <rect x="480" y="200" width="76" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="518" y="237" fill="#1d4ed8">A</text>
  </g>

  <!-- boundary that GROUP BY ignores -->
  <line x1="368" y1="188" x2="368" y2="284" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="368" y="300" text-anchor="middle" font-family="'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="10.5" fill="#b91c1c">边界</text>

  <!-- arrow and result -->
  <line x1="590" y1="232" x2="638" y2="232" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="614" y="222" text-anchor="middle" font-family="'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="11" fill="#64748b">按值聚合</text>

  <rect x="650" y="156" width="280" height="172" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="670" y="184" font-family="'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="13" font-weight="700" fill="#0f172a">GROUP BY content</text>
  <line x1="670" y1="196" x2="910" y2="196" stroke="#e2e8f0"/>

  <rect x="670" y="211" width="12" height="12" rx="3" fill="#dbeafe" stroke="#2563eb"/>
  <text x="692" y="224" font-family="Consolas, monospace" font-size="16" fill="#1d4ed8">A</text>
  <text x="910" y="224" text-anchor="end" font-family="Consolas, monospace" font-size="14" fill="#475569">4 行</text>

  <rect x="670" y="239" width="12" height="12" rx="3" fill="#d1fae5" stroke="#059669"/>
  <text x="692" y="252" font-family="Consolas, monospace" font-size="16" fill="#047857">B</text>
  <text x="910" y="252" text-anchor="end" font-family="Consolas, monospace" font-size="14" fill="#475569">1 行</text>

  <line x1="670" y1="266" x2="910" y2="266" stroke="#e2e8f0"/>
  <text x="670" y="294" font-family="'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="14" font-weight="700" fill="#b91c1c">2 个值分组</text>
  <text x="670" y="314" font-family="'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="11.5" fill="#b91c1c">但 A 的 4 行并不连续</text>

  <text x="64" y="320" font-family="'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="13.5" fill="#334155">A 的 4 行被合并成一组；B 只是另一个组，并没有切断 A。</text>

  <!-- bottom panel: islands -->
  <rect x="40" y="380" width="920" height="250" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="64" y="396" width="190" height="28" rx="14" fill="#d1fae5"/>
  <text x="159" y="415" text-anchor="middle" font-family="'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="12.5" font-weight="700" fill="#047857">按连续段分组（Islands）</text>
  <text x="64" y="444" font-family="'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="12.5" fill="#64748b">先按 id 排序，再在值变化处切开。</text>

  <g font-family="Consolas, monospace" font-size="12" fill="#94a3b8" text-anchor="middle">
    <text x="118" y="462">1</text>
    <text x="218" y="462">2</text>
    <text x="318" y="462">3</text>
    <text x="418" y="462">4</text>
    <text x="518" y="462">5</text>
  </g>

  <g font-family="Consolas, monospace" font-size="26" font-weight="700" text-anchor="middle">
    <rect x="80" y="470" width="76" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="118" y="507" fill="#1d4ed8">A</text>
    <rect x="180" y="470" width="76" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="218" y="507" fill="#1d4ed8">A</text>

    <rect x="280" y="470" width="76" height="58" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
    <text x="318" y="507" fill="#047857">B</text>

    <rect x="380" y="470" width="76" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="418" y="507" fill="#1d4ed8">A</text>
    <rect x="480" y="470" width="76" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="518" y="507" fill="#1d4ed8">A</text>
  </g>

  <!-- island brackets -->
  <g fill="none" stroke-width="1.5">
    <path d="M80 544 V554 H256 V544" stroke="#2563eb"/>
    <path d="M280 544 V554 H356 V544" stroke="#059669"/>
    <path d="M380 544 V554 H556 V544" stroke="#2563eb"/>
  </g>
  <g font-family="'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="12" text-anchor="middle">
    <text x="168" y="576" fill="#1d4ed8">Island 1 · A × 2</text>
    <text x="318" y="576" fill="#047857">Island 2 · B × 1</text>
    <text x="468" y="576" fill="#1d4ed8">Island 3 · A × 2</text>
  </g>

  <!-- arrow and result -->
  <line x1="590" y1="502" x2="638" y2="502" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="614" y="492" text-anchor="middle" font-family="'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="11" fill="#64748b">按连续段</text>

  <rect x="650" y="430" width="280" height="178" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="670" y="458" font-family="'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="13" font-weight="700" fill="#0f172a">按连续段分组</text>
  <line x1="670" y1="470" x2="910" y2="470" stroke="#e2e8f0"/>

  <rect x="670" y="485" width="12" height="12" rx="3" fill="#dbeafe" stroke="#2563eb"/>
  <text x="692" y="498" font-family="Consolas, monospace" font-size="16" fill="#1d4ed8">A</text>
  <text x="910" y="498" text-anchor="end" font-family="Consolas, monospace" font-size="14" fill="#475569">2 行</text>

  <rect x="670" y="513" width="12" height="12" rx="3" fill="#d1fae5" stroke="#059669"/>
  <text x="692" y="526" font-family="Consolas, monospace" font-size="16" fill="#047857">B</text>
  <text x="910" y="526" text-anchor="end" font-family="Consolas, monospace" font-size="14" fill="#475569">1 行</text>

  <rect x="670" y="541" width="12" height="12" rx="3" fill="#dbeafe" stroke="#2563eb"/>
  <text x="692" y="554" font-family="Consolas, monospace" font-size="16" fill="#1d4ed8">A</text>
  <text x="910" y="554" text-anchor="end" font-family="Consolas, monospace" font-size="14" fill="#475569">2 行</text>

  <line x1="670" y1="566" x2="910" y2="566" stroke="#e2e8f0"/>
  <text x="670" y="590" font-family="'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="14" font-weight="700" fill="#047857">3 个岛</text>

  <text x="64" y="620" font-family="'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="13.5" fill="#334155">同一个 A 值出现在两个岛里；GROUP BY 只看到 4 个 A，看不到中间的 B。</text>

  <text x="952" y="646" text-anchor="end" font-family="Consolas, monospace" font-size="12" fill="#94a3b8">图 2</text>
</svg>
