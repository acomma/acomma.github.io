<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">重叠区间合并示意</title>
  <desc id="desc">五个半开区间按起点排序，用已经处理区间的最大右端点判断是否开启新岛，合并为三个连续区间。</desc>
  <rect width="1000" height="520" rx="18" fill="#f8fafc"/>
  <rect x="0.5" y="0.5" width="999" height="519" rx="18" fill="none" stroke="#e2e8f0"/>

  <text x="48" y="56" font-family="'Segoe UI', 'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="26" font-weight="700" fill="#0f172a">重叠区间：看“历史最远右端点”</text>
  <text x="48" y="84" font-family="'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="15" fill="#64748b">区间长度不一致，不能用行号差分；排序后维护 max_end，起点越过它才开启新岛。</text>

  <!-- gap bands -->
  <rect x="380" y="100" width="50" height="300" fill="#fee2e2" opacity="0.65"/>
  <rect x="680" y="100" width="100" height="300" fill="#fee2e2" opacity="0.65"/>
  <text x="405" y="116" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#b91c1c">gap 6–7</text>
  <text x="730" y="116" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#b91c1c">gap 12–14</text>

  <!-- grid -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="80" y1="100" x2="80" y2="400"/>
    <line x1="180" y1="100" x2="180" y2="400"/>
    <line x1="280" y1="100" x2="280" y2="400"/>
    <line x1="330" y1="100" x2="330" y2="400"/>
    <line x1="430" y1="100" x2="430" y2="400"/>
    <line x1="530" y1="100" x2="530" y2="400"/>
    <line x1="630" y1="100" x2="630" y2="400"/>
    <line x1="780" y1="100" x2="780" y2="400"/>
    <line x1="880" y1="100" x2="880" y2="400"/>
  </g>

  <!-- interval rows -->
  <g font-family="Consolas, monospace">
    <text x="50" y="140" font-size="13" fill="#475569">A</text>
    <rect x="130" y="120" width="150" height="28" rx="6" fill="#93c5fd" stroke="#2563eb"/>
    <text x="205" y="139" text-anchor="middle" font-size="12" fill="#1e3a8a">[1, 4)</text>

    <text x="50" y="195" font-size="13" fill="#475569">B</text>
    <rect x="230" y="175" width="150" height="28" rx="6" fill="#60a5fa" stroke="#2563eb"/>
    <text x="305" y="194" text-anchor="middle" font-size="12" fill="#1e3a8a">[3, 6)</text>

    <text x="50" y="250" font-size="13" fill="#475569">C</text>
    <rect x="430" y="230" width="100" height="28" rx="6" fill="#6ee7b7" stroke="#059669"/>
    <text x="480" y="249" text-anchor="middle" font-size="12" fill="#064e3b">[7, 9)</text>

    <text x="50" y="305" font-size="13" fill="#475569">D</text>
    <rect x="480" y="285" width="200" height="28" rx="6" fill="#34d399" stroke="#059669"/>
    <text x="580" y="304" text-anchor="middle" font-size="12" fill="#064e3b">[8, 12)</text>

    <text x="50" y="360" font-size="13" fill="#475569">E</text>
    <rect x="780" y="340" width="50" height="28" rx="6" fill="#fcd34d" stroke="#d97706"/>
    <text x="805" y="359" text-anchor="middle" font-size="12" fill="#78350f">[14, 15)</text>
  </g>

  <!-- current max end markers -->
  <g stroke-width="2" stroke-dasharray="4 4">
    <line x1="280" y1="112" x2="280" y2="205" stroke="#2563eb"/>
    <line x1="380" y1="112" x2="380" y2="216" stroke="#2563eb"/>
    <line x1="530" y1="222" x2="530" y2="318" stroke="#059669"/>
    <line x1="680" y1="222" x2="680" y2="318" stroke="#059669"/>
  </g>

  <!-- annotations -->
  <g font-family="'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="13">
    <rect x="240" y="148" width="150" height="24" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="315" y="165" text-anchor="middle" fill="#1d4ed8">start 3 ≤ 4 → 合并</text>

    <rect x="430" y="204" width="150" height="24" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="505" y="221" text-anchor="middle" fill="#047857">start 7 &gt; 6 → 新岛</text>

    <rect x="480" y="258" width="150" height="24" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="555" y="275" text-anchor="middle" fill="#047857">start 8 ≤ 9 → 合并</text>

    <rect x="768" y="310" width="160" height="24" rx="12" fill="#fffbeb" stroke="#fde68a"/>
    <text x="848" y="327" text-anchor="middle" fill="#b45309">start 14 &gt; 12 → 新岛</text>
  </g>

  <!-- axis -->
  <line x1="80" y1="400" x2="880" y2="400" stroke="#94a3b8"/>
  <g font-family="Consolas, monospace" font-size="12" fill="#64748b" text-anchor="middle">
    <text x="80" y="417">0</text>
    <text x="180" y="417">2</text>
    <text x="280" y="417">4</text>
    <text x="380" y="417">6</text>
    <text x="480" y="417">8</text>
    <text x="580" y="417">10</text>
    <text x="680" y="417">12</text>
    <text x="780" y="417">14</text>
    <text x="880" y="417">16</text>
  </g>

  <!-- merged output -->
  <text x="48" y="455" font-family="'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="13" font-weight="600" fill="#0f172a">合并结果</text>
  <g>
    <rect x="130" y="440" width="250" height="24" rx="6" fill="#bfdbfe" stroke="#2563eb"/>
    <text x="255" y="457" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#1e3a8a">[1, 6)</text>

    <rect x="430" y="440" width="250" height="24" rx="6" fill="#a7f3d0" stroke="#059669"/>
    <text x="555" y="457" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#064e3b">[7, 12)</text>

    <rect x="780" y="440" width="50" height="24" rx="6" fill="#fde68a" stroke="#d97706"/>
    <text x="846" y="457" text-anchor="start" font-family="Consolas, monospace" font-size="12" fill="#78350f">[14, 15)</text>
  </g>

  <text x="48" y="500" font-family="'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="13" fill="#475569">max_end 是“已经处理过的所有区间”的最大右端点，不是前一行的 end；这样嵌套区间也不会漏。</text>
  <text x="952" y="500" text-anchor="end" font-family="Consolas, monospace" font-size="12" fill="#94a3b8">图 7</text>
</svg>
